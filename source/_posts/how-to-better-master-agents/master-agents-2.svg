<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-label="任务拆解流水线">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1a14"/>
      <stop offset="60%" stop-color="#174431"/>
      <stop offset="100%" stop-color="#2ea86a"/>
    </linearGradient>
    <linearGradient id="lane" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ddffe8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ddffe8" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <rect width="1376" height="768" fill="url(#bg2)"/>
  <text x="88" y="118" font-size="56" fill="#effff3" font-family="Arial, sans-serif" font-weight="700">把复杂任务切成可验证流水线</text>
  <g font-family="Arial, sans-serif">
    <rect x="96" y="180" width="1180" height="118" rx="18" fill="url(#lane)" stroke="#adf2c9" stroke-opacity="0.7"/>
    <circle cx="170" cy="239" r="34" fill="#d9ffe8"/><text x="158" y="249" font-size="28" fill="#19442f" font-weight="700">1</text>
    <text x="224" y="232" font-size="34" fill="#f3fff7" font-weight="700">结构草图</text>
    <text x="224" y="268" font-size="24" fill="#d7ffe6">先确定信息框架、边界和交付结构</text>
    <rect x="96" y="330" width="1180" height="118" rx="18" fill="url(#lane)" stroke="#adf2c9" stroke-opacity="0.7"/>
    <circle cx="170" cy="389" r="34" fill="#d9ffe8"/><text x="158" y="399" font-size="28" fill="#19442f" font-weight="700">2</text>
    <text x="224" y="382" font-size="34" fill="#f3fff7" font-weight="700">证据填充</text>
    <text x="224" y="418" font-size="24" fill="#d7ffe6">补案例、补边界条件、补可验证依据</text>
    <rect x="96" y="480" width="1180" height="118" rx="18" fill="url(#lane)" stroke="#adf2c9" stroke-opacity="0.7"/>
    <circle cx="170" cy="539" r="34" fill="#d9ffe8"/><text x="158" y="549" font-size="28" fill="#19442f" font-weight="700">3</text>
    <text x="224" y="532" font-size="34" fill="#f3fff7" font-weight="700">人工审校</text>
    <text x="224" y="568" font-size="24" fill="#d7ffe6">统一风格与风险复核，确保可直接发布</text>
  </g>
  <g stroke="#d9ffe8" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8">
    <line x1="1150" y1="239" x2="1220" y2="239"/><line x1="1210" y1="229" x2="1220" y2="239"/><line x1="1210" y1="249" x2="1220" y2="239"/>
    <line x1="1150" y1="389" x2="1220" y2="389"/><line x1="1210" y1="379" x2="1220" y2="389"/><line x1="1210" y1="399" x2="1220" y2="389"/>
  </g>
  <rect x="0" y="636" width="1376" height="132" fill="#09150f" fill-opacity="0.55"/>
  <text x="90" y="708" font-size="30" fill="#e8fff0" font-family="Arial, sans-serif">每一层都可验收，才能避免“看似完成，实则不可用”</text>
</svg>
