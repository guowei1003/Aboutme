<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-label="编辑部协作，比喻 agent harness 通过分工与中间产物完成复杂任务">
  <title>一篇稿子，像一个编辑部</title>
  <defs>
    <linearGradient id="bg-newsroom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6f1e8"/>
      <stop offset="100%" stop-color="#e3d3bc"/>
    </linearGradient>
    <style>
      .title { font: 700 54px Georgia, "Times New Roman", serif; fill: #2d231b; }
      .subtitle { font: 500 23px "Helvetica Neue", Arial, sans-serif; fill: #5e4f43; }
      .desk { fill: #efe2d0; stroke: #7a5e43; stroke-width: 3; }
      .desk-dark { fill: #d4b390; stroke: #7a5e43; stroke-width: 3; }
      .ink { fill: #2d231b; }
      .label { font: 700 24px "Helvetica Neue", Arial, sans-serif; fill: #2d231b; }
      .small { font: 600 18px "Helvetica Neue", Arial, sans-serif; fill: #4f4034; }
      .tiny { font: 700 16px "Helvetica Neue", Arial, sans-serif; fill: #4f4034; }
    </style>
  </defs>

  <rect width="1376" height="768" fill="url(#bg-newsroom)"/>
  <rect x="58" y="62" width="1260" height="644" rx="34" fill="#fbf7f0" stroke="#d7b894" stroke-width="2"/>
  <rect x="96" y="640" width="1184" height="28" rx="14" fill="#d2b38d"/>

  <text x="96" y="130" class="title">一篇稿子，像一个编辑部</text>
  <text x="98" y="170" class="subtitle">不是一个全能个体硬扛，而是主编、调度、记者、整理、写作、核查和底层工具一起配合。</text>

  <rect x="520" y="186" width="290" height="88" rx="24" class="desk-dark"/>
  <rect x="594" y="150" width="140" height="36" rx="16" fill="#fff6e9" stroke="#8d6e4f" stroke-width="2"/>
  <text x="626" y="173" class="tiny">Human</text>
  <text x="600" y="236" class="label">总编辑</text>
  <text x="586" y="266" class="small">定目标、定边界、定终稿</text>
  <circle cx="780" cy="160" r="12" fill="#2d231b"/>
  <line x1="780" y1="172" x2="780" y2="208" stroke="#2d231b" stroke-width="5" stroke-linecap="round"/>
  <line x1="780" y1="186" x2="760" y2="204" stroke="#2d231b" stroke-width="5" stroke-linecap="round"/>
  <line x1="780" y1="186" x2="798" y2="204" stroke="#2d231b" stroke-width="5" stroke-linecap="round"/>

  <rect x="456" y="316" width="464" height="126" rx="32" fill="#d6bd9f" stroke="#7a5e43" stroke-width="4"/>
  <rect x="580" y="286" width="220" height="42" rx="18" fill="#fff5e8" stroke="#8d6e4f" stroke-width="2"/>
  <text x="600" y="314" class="tiny">@agents-orchestrator</text>
  <text x="604" y="372" class="label">值班调度台</text>
  <text x="536" y="404" class="small">拆任务、收结果、控阶段、把稿纸送到对的人手里</text>
  <rect x="508" y="344" width="48" height="62" rx="8" fill="#fff5e8" stroke="#8d6e4f" stroke-width="2"/>
  <rect x="820" y="344" width="48" height="62" rx="8" fill="#fff5e8" stroke="#8d6e4f" stroke-width="2"/>

  <rect x="124" y="316" width="244" height="118" rx="26" class="desk"/>
  <text x="164" y="366" class="label">搜索记者</text>
  <text x="164" y="396" class="small">Search Agent</text>
  <circle cx="314" cy="348" r="24" fill="none" stroke="#7a5e43" stroke-width="5"/>
  <line x1="330" y1="364" x2="348" y2="382" stroke="#7a5e43" stroke-width="5" stroke-linecap="round"/>

  <rect x="124" y="500" width="264" height="126" rx="26" class="desk"/>
  <text x="162" y="552" class="label">资料编辑</text>
  <text x="162" y="582" class="small">Organize Agent</text>
  <rect x="294" y="534" width="52" height="36" rx="8" fill="#fff5e8" stroke="#8d6e4f" stroke-width="2"/>
  <rect x="282" y="548" width="52" height="36" rx="8" fill="#f7ead8" stroke="#8d6e4f" stroke-width="2"/>
  <rect x="270" y="562" width="52" height="36" rx="8" fill="#efe1cd" stroke="#8d6e4f" stroke-width="2"/>

  <rect x="1004" y="316" width="240" height="118" rx="26" class="desk"/>
  <text x="1044" y="366" class="label">撰稿人</text>
  <text x="1044" y="396" class="small">Writer Agent</text>
  <line x1="1180" y1="344" x2="1180" y2="392" stroke="#7a5e43" stroke-width="4"/>
  <line x1="1162" y1="360" x2="1198" y2="360" stroke="#7a5e43" stroke-width="4"/>
  <line x1="1166" y1="376" x2="1196" y2="376" stroke="#7a5e43" stroke-width="4"/>

  <rect x="964" y="500" width="280" height="126" rx="26" class="desk"/>
  <text x="1002" y="552" class="label">事实核查</text>
  <text x="1002" y="582" class="small">Verifier Agent</text>
  <circle cx="1176" cy="556" r="20" fill="none" stroke="#7a5e43" stroke-width="5"/>
  <line x1="1190" y1="570" x2="1210" y2="592" stroke="#7a5e43" stroke-width="5" stroke-linecap="round"/>

  <rect x="1160" y="180" width="112" height="74" rx="18" fill="#d1e0d4" stroke="#6b7f6b" stroke-width="3"/>
  <text x="1188" y="224" class="tiny">工具柜</text>
  <rect x="1160" y="272" width="112" height="74" rx="18" fill="#efe2b9" stroke="#8d7a4f" stroke-width="3"/>
  <text x="1188" y="316" class="tiny">卡片盒</text>
  <rect x="1160" y="364" width="112" height="74" rx="18" fill="#e5b8aa" stroke="#985642" stroke-width="3"/>
  <text x="1188" y="408" class="tiny">审批章</text>
  <rect x="1160" y="456" width="112" height="74" rx="18" fill="#c8d3e5" stroke="#5f718d" stroke-width="3"/>
  <text x="1180" y="500" class="tiny">值班日志</text>

  <path d="M368 370 C430 364 454 360 506 360" fill="none" stroke="#8f6d49" stroke-width="4" stroke-dasharray="10 12"/>
  <path d="M388 560 C438 518 456 478 520 432" fill="none" stroke="#8f6d49" stroke-width="4" stroke-dasharray="10 12"/>
  <path d="M920 364 C968 362 984 362 1004 362" fill="none" stroke="#8f6d49" stroke-width="4" stroke-dasharray="10 12"/>
  <path d="M898 428 C954 470 980 504 1014 540" fill="none" stroke="#8f6d49" stroke-width="4" stroke-dasharray="10 12"/>
  <path d="M664 274 C664 294 674 300 688 316" fill="none" stroke="#8f6d49" stroke-width="4" stroke-dasharray="10 10"/>

  <rect x="418" y="344" width="40" height="28" rx="6" fill="#fff8ee" stroke="#8d6e4f" stroke-width="2" transform="rotate(-8 438 358)"/>
  <rect x="416" y="548" width="40" height="28" rx="6" fill="#fff8ee" stroke="#8d6e4f" stroke-width="2" transform="rotate(8 436 562)"/>
  <rect x="940" y="346" width="40" height="28" rx="6" fill="#fff8ee" stroke="#8d6e4f" stroke-width="2" transform="rotate(6 960 360)"/>
  <rect x="928" y="478" width="40" height="28" rx="6" fill="#fff8ee" stroke="#8d6e4f" stroke-width="2" transform="rotate(-10 948 492)"/>

  <text x="98" y="692" class="subtitle">让稿纸流动，而不是让所有人共享同一锅上下文；这才是 Harness 真正的分工价值。</text>
</svg>
