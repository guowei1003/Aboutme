<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-label="快马与马具，比喻 agent harness 让强大的 Agent 变得可控">
  <title>再快的马，也要有马具</title>
  <defs>
