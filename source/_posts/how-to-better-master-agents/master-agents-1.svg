      <stop offset="0%" stop-color="#f6efe5"/>
      <stop offset="100%" stop-color="#e7d3b9"/>
    </linearGradient>
    <linearGradient id="paper-horse" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffaf3"/>
      <stop offset="100%" stop-color="#f1e4d2"/>
    </linearGradient>
    <style>
      .title { font: 700 58px Georgia, "Times New Roman", serif; fill: #2f241a; }
      .subtitle { font: 500 24px "Helvetica Neue", Arial, sans-serif; fill: #5d4c3d; }
      .label { font: 700 24px "Helvetica Neue", Arial, sans-serif; fill: #2f241a; }
      .small { font: 600 19px "Helvetica Neue", Arial, sans-serif; fill: #4f3f32; }
      .tag { font: 700 20px "Helvetica Neue", Arial, sans-serif; fill: #2f241a; }
    </style>
  </defs>

  <rect width="1376" height="768" fill="url(#bg-horse)"/>
