<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-label="收益与风险双曲线">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181526"/>
      <stop offset="60%" stop-color="#2f2c4a"/>
      <stop offset="100%" stop-color="#4b496e"/>
    </linearGradient>
  </defs>
  <rect width="1376" height="768" fill="url(#bg5)"/>
  <text x="88" y="110" font-size="54" fill="#f6f4ff" font-family="Arial, sans-serif" font-weight="700">效率收益与风险暴露会同步上升</text>
  <g stroke="#d8d3ff" stroke-opacity="0.35">
    <line x1="120" y1="620" x2="1240" y2="620"/>
    <line x1="120" y1="180" x2="120" y2="620"/>
  </g>
  <g fill="none" stroke-width="8">
    <path d="M120 570 C350 520, 620 420, 1240 240" stroke="#67f0be"/>
    <path d="M120 610 C420 600, 760 510, 1240 300" stroke="#ff8aa8"/>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="840" y="232" width="370" height="62" rx="12" fill="#67f0be" fill-opacity="0.18" stroke="#67f0be"/>
    <text x="870" y="273" font-size="28" fill="#dffff3">效率曲线（正向收益）</text>
    <rect x="840" y="304" width="370" height="62" rx="12" fill="#ff8aa8" fill-opacity="0.18" stroke="#ff8aa8"/>
    <text x="870" y="345" font-size="28" fill="#ffe4eb">风险曲线（暴露面）</text>
    <text x="134" y="662" font-size="26" fill="#d9d6ee">时间 / 自动化深度</text>
  </g>
  <circle cx="970" cy="350" r="10" fill="#ffffff"/>
  <text x="990" y="358" font-size="24" fill="#f6f4ff" font-family="Arial, sans-serif">治理分水岭</text>
  <rect x="80" y="680" width="1210" height="60" rx="14" fill="#0f0d1a" fill-opacity="0.5"/>
  <text x="114" y="719" font-size="27" fill="#ece9ff" font-family="Arial, sans-serif">没有治理，效率红利会被风险成本吞噬</text>
</svg>
