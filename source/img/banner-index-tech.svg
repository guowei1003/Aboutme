<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 480" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Tech hero banner">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="bgBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080f">
        <animate attributeName="stop-color" values="#05080f;#070d18;#05080f" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#0a1224">
        <animate attributeName="stop-color" values="#0a1224;#0d1830;#0a1224" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#060a14">
        <animate attributeName="stop-color" values="#060a14;#081020;#060a14" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glowCyan" cx="22%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35">
        <animate attributeName="stop-opacity" values="0.22;0.42;0.22" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="70%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="78%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.28">
        <animate attributeName="stop-opacity" values="0.15;0.38;0.15" dur="6.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="65%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shoreSand" x1="0" y1="480" x2="0" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c1917" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#292524" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#0c4a6e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="fineGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#38bdf8" stroke-opacity="0.08" stroke-width="0.5"/>
    </pattern>
    <filter id="seaBlur" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="24" result="b"/>
      <feGaussianBlur in="b" stdDeviation="12" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style type="text/css"><![CDATA[
      .grid-fade { opacity: 0.22; animation: gridPulse 8s ease-in-out infinite; }
      @keyframes gridPulse { 0%, 100% { opacity: 0.14; } 50% { opacity: 0.32; } }
      .flow-line { stroke-dasharray: 6 14; animation: flowMove 18s linear infinite; }
      .flow-line-rev { stroke-dasharray: 6 14; animation: flowMoveRev 24s linear infinite; }
      @keyframes flowMove { to { stroke-dashoffset: -400; } }
      @keyframes flowMoveRev { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 400; } }
      .label-flicker { animation: labelGlow 5s ease-in-out infinite; }
      @keyframes labelGlow { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.95; } }
      .label-flicker-d { animation: labelGlow 5s ease-in-out infinite; animation-delay: 1s; }
    ]]></style>
  </defs>

  <rect width="1920" height="480" fill="url(#bgBase)"/>
  <rect width="1920" height="480" fill="url(#glowCyan)"/>
  <rect width="1920" height="480" fill="url(#glowViolet)"/>

  <!-- 12 stars: fixed scatter + slow twinkle (SMIL, staggered) -->
  <g fill="#e0f2fe">
    <circle cx="178" cy="92" r="1.6"><animate attributeName="fill-opacity" values="0.2;1;0.35;0.85;0.2" dur="5.8s" repeatCount="indefinite"/><animate attributeName="r" values="1.1;2.1;1.4;1.9;1.1" dur="5.8s" repeatCount="indefinite"/></circle>
    <circle cx="412" cy="58" r="1.4"><animate attributeName="fill-opacity" values="0.3;0.95;0.25;1;0.3" dur="6.4s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="r" values="1;1.9;1.2;1.7;1" dur="6.4s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="668" cy="108" r="1.5"><animate attributeName="fill-opacity" values="0.25;1;0.4;0.9;0.25" dur="4.9s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="r" values="1.1;2;1.3;1.8;1.1" dur="4.9s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="918" cy="44" r="1.3"><animate attributeName="fill-opacity" values="0.35;0.9;0.2;1;0.35" dur="7.2s" begin="0.2s" repeatCount="indefinite"/><animate attributeName="r" values="0.9;1.8;1.1;1.6;0.9" dur="7.2s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="1152" cy="86" r="1.6"><animate attributeName="fill-opacity" values="0.22;1;0.3;0.88;0.22" dur="5.3s" begin="2s" repeatCount="indefinite"/><animate attributeName="r" values="1.2;2.2;1.5;2;1.2" dur="5.3s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="1418" cy="52" r="1.2"><animate attributeName="fill-opacity" values="0.28;0.92;0.22;0.98;0.28" dur="6.8s" begin="0.7s" repeatCount="indefinite"/><animate attributeName="r" values="0.9;1.7;1.1;1.5;0.9" dur="6.8s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="1676" cy="118" r="1.5"><animate attributeName="fill-opacity" values="0.3;1;0.35;0.9;0.3" dur="5.1s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="r" values="1;2;1.3;1.8;1" dur="5.1s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="308" cy="218" r="1.3"><animate attributeName="fill-opacity" values="0.24;0.95;0.28;1;0.24" dur="6.1s" begin="0.9s" repeatCount="indefinite"/><animate attributeName="r" values="1;1.9;1.2;1.7;1" dur="6.1s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="792" cy="176" r="1.4"><animate attributeName="fill-opacity" values="0.32;1;0.26;0.92;0.32" dur="4.6s" begin="2.3s" repeatCount="indefinite"/><animate attributeName="r" values="1.1;2;1.4;1.8;1.1" dur="4.6s" begin="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="1286" cy="198" r="1.5"><animate attributeName="fill-opacity" values="0.26;0.98;0.32;0.88;0.26" dur="7s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="r" values="1.2;2.1;1.5;1.9;1.2" dur="7s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="524" cy="248" r="1.2"><animate attributeName="fill-opacity" values="0.3;0.9;0.24;1;0.3" dur="5.5s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="r" values="0.9;1.7;1.1;1.5;0.9" dur="5.5s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="1502" cy="162" r="1.4"><animate attributeName="fill-opacity" values="0.22;1;0.3;0.95;0.22" dur="6.3s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="r" values="1;1.9;1.2;1.7;1" dur="6.3s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ??????????? + ?????? -->
  <g filter="url(#seaBlur)" opacity="0.92">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 45 -18; -35 12; 25 -8; 0 0" dur="18s" repeatCount="indefinite"/>
      <path d="M-400 420 Q200 360 640 395 T1280 385 T2200 410 L2200 520 L-400 520 Z" fill="#0c4a6e"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; -55 14; 40 -10; -20 8; 0 0" dur="14s" repeatCount="indefinite"/>
      <path d="M-300 455 Q480 400 960 425 T1920 438 L1920 520 L-300 520 Z" fill="#155e75"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 38 20; -48 -6; 15 14; 0 0" dur="11s" repeatCount="indefinite"/>
      <path d="M-200 475 Q520 430 1040 450 T2000 462 L2000 520 L-200 520 Z" fill="#0891b2" fill-opacity="0.55"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; -30 22; 50 -12; 0 0" dur="9s" repeatCount="indefinite"/>
      <path d="M-100 495 Q600 460 1120 478 T1980 488 L1980 520 L-100 520 Z" fill="#22d3ee" fill-opacity="0.35"/>
    </g>
  </g>
  <rect x="0" y="300" width="1920" height="180" fill="url(#shoreSand)"/>

  <rect width="1920" height="480" fill="url(#fineGrid)" class="grid-fade"/>

  <g opacity="0.35">
    <path d="M0 380 L1920 380" stroke="#22d3ee" stroke-width="0.6" stroke-opacity="0.25"/>
    <path d="M0 400 L1920 400" stroke="#22d3ee" stroke-width="0.4" stroke-opacity="0.15"/>
    <path d="M120 480 L400 200 M360 480 L640 200 M600 480 L880 200 M840 480 L1120 200 M1080 480 L1360 200 M1320 480 L1600 200 M1560 480 L1840 200" fill="none" stroke="#64748b" stroke-width="0.5" stroke-opacity="0.35"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <path class="flow-line" d="M80 420 L280 300 L520 340 L720 220 L920 260 L1120 180 L1320 220 L1520 140 L1840 200" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.55"/>
    <path class="flow-line-rev" d="M40 200 L220 280 L420 200 L620 260 L900 120 L1180 200 L1480 100 L1880 160" stroke="#a78bfa" stroke-width="0.9" stroke-opacity="0.4"/>
  </g>

  <g opacity="0.5">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 960 240" to="360 960 240" dur="48s" repeatCount="indefinite"/>
      <circle cx="960" cy="240" r="120" fill="none" stroke="#22d3ee" stroke-width="0.5" stroke-opacity="0.4"/>
      <circle cx="960" cy="240" r="88" fill="none" stroke="#a78bfa" stroke-width="0.4" stroke-opacity="0.35" stroke-dasharray="4 8"/>
      <circle cx="960" cy="240" r="56" fill="none" stroke="#f59e0b" stroke-width="0.35" stroke-opacity="0.3"/>
    </g>
  </g>
  <circle cx="960" cy="240" r="4" fill="#22d3ee" fill-opacity="0.8">
    <animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <g stroke="#94a3b8" stroke-opacity="0.2" stroke-width="0.5" fill="none">
    <path d="M200 80h320M1400 400h320"/>
    <path d="M200 400h180M1540 80h180"/>
  </g>

  <rect x="0" y="456" width="1920" height="24" fill="#020617" fill-opacity="0.65"/>
  <text x="48" y="472" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11" fill="#94a3b8" class="label-flicker">SIGNAL / STABLE / WORKFLOW SYNC</text>
  <text x="1872" y="472" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11" fill="#94a3b8" text-anchor="end" class="label-flicker-d">AI ASSIST / ONLINE</text>

  <rect width="1920" height="480" fill="url(#vignette)" style="pointer-events:none"/>
</svg>
