<svg width="1400" height="860" viewBox="0 0 1400 860" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E2130"/>
      <stop offset="1" stop-color="#163A49"/>
    </linearGradient>
    <style>
      .h1 { font: 700 44px "Helvetica Neue", Arial, sans-serif; fill: #F7FAFC; }
      .h2 { font: 700 26px "Helvetica Neue", Arial, sans-serif; fill: #082133; }
      .t { font: 500 18px "Helvetica Neue", Arial, sans-serif; fill: #DCEAF2; }
      .b { font: 500 18px "Helvetica Neue", Arial, sans-serif; fill: #183142; }
    </style>
  </defs>
  <rect width="1400" height="860" fill="url(#bg)"/>
  <text x="90" y="110" class="h1">Which lobster farming route fits you?</text>

  <rect x="490" y="150" width="420" height="110" rx="28" fill="#F0F7FB"/>
  <text x="570" y="215" class="h2">What do you want first?</text>

  <rect x="120" y="360" width="360" height="170" rx="28" fill="#D8FFF3"/>
  <text x="170" y="430" class="h2">I want to control the system</text>
  <text x="170" y="465" class="b">Choose OpenClaw native</text>
  <text x="170" y="500" class="b">Learn Gateway, model, channel,</text>
  <text x="170" y="530" class="b">security in one flow</text>

  <rect x="520" y="360" width="360" height="170" rx="28" fill="#FFF1D5"/>
  <text x="570" y="430" class="h2">I want the lowest API cost</text>
  <text x="570" y="465" class="b">Choose OpenClaw + Ollama</text>
  <text x="570" y="500" class="b">Model cost can be near zero,</text>
  <text x="570" y="530" class="b">but hardware work goes up</text>

  <rect x="920" y="360" width="360" height="170" rx="28" fill="#E7EEF7"/>
  <text x="970" y="430" class="h2">I want to publish fast</text>
  <text x="970" y="465" class="b">Choose Coze / Yuanqi / Bailian</text>
  <text x="970" y="500" class="b">Great for release and sharing,</text>
  <text x="970" y="530" class="b">not the same as self-hosting</text>

  <rect x="260" y="620" width="360" height="120" rx="28" fill="#0F4E65"/>
  <text x="320" y="690" class="t">Best all-round beginner path:</text>
  <text x="320" y="720" class="t">OpenClaw + Qwen Portal + Dashboard</text>

  <rect x="780" y="620" width="360" height="120" rx="28" fill="#2F6E63"/>
  <text x="840" y="690" class="t">First external channel later:</text>
  <text x="840" y="720" class="t">Telegram after local verification</text>

  <path d="M700 260V320" stroke="#9ED0E1" stroke-width="8" stroke-linecap="round"/>
  <path d="M700 320H300" stroke="#9ED0E1" stroke-width="8" stroke-linecap="round"/>
  <path d="M700 320H700" stroke="#F4C56C" stroke-width="8" stroke-linecap="round"/>
  <path d="M700 320H1100" stroke="#C7D7E8" stroke-width="8" stroke-linecap="round"/>
  <path d="M300 320V360" stroke="#9ED0E1" stroke-width="8" stroke-linecap="round"/>
  <path d="M700 320V360" stroke="#F4C56C" stroke-width="8" stroke-linecap="round"/>
  <path d="M1100 320V360" stroke="#C7D7E8" stroke-width="8" stroke-linecap="round"/>
  <path d="M300 530V620" stroke="#3DB8A0" stroke-width="8" stroke-linecap="round"/>
  <path d="M1100 530V620" stroke="#3DB8A0" stroke-width="8" stroke-linecap="round"/>
</svg>
