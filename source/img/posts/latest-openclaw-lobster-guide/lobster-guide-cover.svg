<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1F33"/>
      <stop offset="1" stop-color="#103B52"/>
    </linearGradient>
    <linearGradient id="card" x1="260" y1="140" x2="1260" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#143A52"/>
      <stop offset="1" stop-color="#0E2436"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6BE7C8"/>
      <stop offset="1" stop-color="#F5BE62"/>
    </linearGradient>
    <style>
      .title { font: 700 64px "Helvetica Neue", Arial, sans-serif; fill: #F4F7FB; }
      .subtitle { font: 500 26px "Helvetica Neue", Arial, sans-serif; fill: #BBD3E3; }
      .label { font: 700 22px "Helvetica Neue", Arial, sans-serif; fill: #0E2232; }
      .small { font: 500 18px "Helvetica Neue", Arial, sans-serif; fill: #D9E9F4; }
      .chip { font: 700 18px "Helvetica Neue", Arial, sans-serif; fill: #082133; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1360" cy="180" r="140" fill="#0F4E65" fill-opacity="0.4"/>
  <circle cx="1290" cy="240" r="70" fill="#1A6E7A" fill-opacity="0.25"/>
  <rect x="140" y="110" width="1320" height="680" rx="36" fill="url(#card)" stroke="#2A6072" stroke-width="2"/>
  <text x="220" y="250" class="title">Latest "Lobster" Farming Method</text>
  <text x="220" y="300" class="subtitle">OpenClaw end-to-end deployment guide for beginners</text>
  <rect x="220" y="348" width="220" height="52" rx="26" fill="#6BE7C8"/>
  <text x="254" y="381" class="chip">OpenClaw Native</text>
  <rect x="458" y="348" width="176" height="52" rx="26" fill="#F5BE62"/>
  <text x="496" y="381" class="chip">Qwen Free</text>
  <rect x="650" y="348" width="180" height="52" rx="26" fill="#E8EEF5"/>
  <text x="690" y="381" class="chip">Telegram</text>

  <rect x="230" y="470" width="300" height="170" rx="28" fill="#D8FFF3"/>
  <text x="270" y="530" class="label">Gateway</text>
  <text x="270" y="565" class="small" fill="#0E2232">Control plane</text>
  <text x="270" y="595" class="small" fill="#0E2232">Sessions, tools, channels</text>

  <rect x="560" y="470" width="250" height="170" rx="28" fill="#FFF1D5"/>
  <text x="600" y="530" class="label">Models</text>
  <text x="600" y="565" class="small" fill="#0E2232">Qwen Portal</text>
  <text x="600" y="595" class="small" fill="#0E2232">Ollama / OAuth</text>

  <rect x="840" y="470" width="250" height="170" rx="28" fill="#E7EEF7"/>
  <text x="880" y="530" class="label">Channels</text>
  <text x="880" y="565" class="small" fill="#0E2232">Telegram first</text>
  <text x="880" y="595" class="small" fill="#0E2232">Expand later</text>

  <rect x="1120" y="470" width="250" height="170" rx="28" fill="#D5E9F1"/>
  <text x="1160" y="530" class="label">Dashboard</text>
  <text x="1160" y="565" class="small" fill="#0E2232">Test local first</text>
  <text x="1160" y="595" class="small" fill="#0E2232">Do not expose directly</text>

  <path d="M530 555H560" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <path d="M810 555H840" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <path d="M1090 555H1120" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>

  <text x="220" y="710" class="small">Pick a model. Build the gateway. Verify locally. Add one channel. Grow later.</text>
