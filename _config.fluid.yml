# 导航菜单
navbar:
  blog_title: AI芝士
  blog_name: AI芝士
  menu:
    - { name: "首页", link: "/", icon: "icon-home" }
    - { name: "AI 日报", link: "/categories/AI-Daily/", icon: "icon-bookmark" }
    - { name: "观点与方法", link: "/categories/芝士力量/", icon: "icon-calendar" }
    - { name: "进化记录", link: "/evolution/", icon: "icon-star" }

# 页脚配置
footer:
  content: 'AI芝士知识熟成实验室 | © 2026 Kapibala'
  beian:
    enable: true
    icp_text: 京ICP备2025110112号-4
    police_text: ""
    police_code: ""
    police_icon: ""

# 首页配置
index:
  banner_img: /img/banner-home-editorial.svg
  banner_img_height: 32
  banner_mask_alpha: 0.44
  slogan:
    enable: true
    text: 慢慢熟成的知识实验室
  post_url_target: _self
  post_meta:
    date: true
    category: true
    tag: true

# 文章页配置
post:
  banner_img: /img/banner-inner-editorial.svg
  banner_img_height: 20
  banner_mask_alpha: 0.52
  default_index_img: /img/default-cover-editorial.svg
  meta:
    author: true
    date: true
    category: true
    tag: true
  toc:
    enable: true
    placement: right
    expand_all: false
    headingSelector: h2,h3,h4
    collapseDepth: 1
  copyright:
    enable: true
    content: '本文作者：芝士就是力量<br>本文链接：<a href="%s">%s</a><br>版权声明：欢迎转载与交流，转载请注明来源与原文链接。'

# 归档页配置
archive:
  banner_img: /img/banner-inner-editorial.svg
  banner_img_height: 22
  banner_mask_alpha: 0.5

# 分类页配置
category:
  enable: true
  banner_img: /img/banner-inner-editorial.svg
  banner_img_height: 22
  banner_mask_alpha: 0.5

# 标签页配置
tag:
  enable: true
  banner_img: /img/banner-inner-editorial.svg
  banner_img_height: 22
  banner_mask_alpha: 0.5

# 关于页配置
about:
  enable: true
  banner_img: /img/banner-inner-editorial.svg
  banner_img_height: 20
  banner_mask_alpha: 0.5

page:
  banner_img: /img/banner-inner-editorial.svg
  banner_img_height: 20
  banner_mask_alpha: 0.5

# 评论系统 - Waline
post_comments:
  enable: true
  type: waline

waline:
  enable: true
  serverURL: https://kapibala.uno/comments
  path: window.location.pathname
  meta: ["nick", "mail", "link"]
  requiredMeta: ["nick", "mail"]
  login: enable
  wordLimit: 0
  pageSize: 10
  imageUploader: false

# 代码高亮
code:
  highlight:
    enable: true
    light: github
    dark: github-dark

# 搜索功能
search:
  enable: true
  path: /local-search.xml
  field: post
  content: true

# 网站图标
favicon: /img/logo-ai-pioneer.svg
apple_touch_icon: /img/logo-ai-pioneer.svg

# Canonical
canonical:
  enable: true

# 自定义 JS
custom_js:
  - /js/custom.js

# 自定义 CSS
custom_css:
  - /css/custom.css

# 页面加载动画
loader:
  enable: true
  source: 1

# 回到顶部按钮
back2top:
  enable: true

# 图片懒加载
lazyload:
  enable: true
  onlypost: false
  loading_img: /img/loading-grid.svg
  loadingImg: /img/loading-grid.svg

# 夜间模式
dark_mode:
  enable: true
  default: auto
