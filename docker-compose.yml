services:
  c-mysql:
    image: mysql:8.0
    container_name: c-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:-aboutme}
      MYSQL_USER: ${DATABASE_USER:-aboutme}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-aboutme}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DATABASE_USER:-aboutme}", "-p${DATABASE_PASSWORD:-aboutme}"]
      interval: 10s
      timeout: 5s
      retries: 10

  c-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: c-service
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      c-mysql:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    expose:
      - "8000"

  c-web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE: /api
    container_name: c-web
    restart: unless-stopped
    depends_on:
      - c-service
    ports:
      - "80:80"

volumes:
  mysql_data:
  media_data:
