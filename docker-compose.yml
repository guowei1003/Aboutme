services:
  web:
    # 构建交由 GitHub Actions 完成：CI 生成 public/ 并 rsync 到 /data/aboutme/public，
    # 容器只负责托管，直接挂载该目录，镜像不再包含站点内容。
    image: nginx:alpine
    container_name: kapibala-web
    restart: always
    ports:
      # 服务器 80 已被 collectcar-nginx 占用，站点默认改走 8888 (HTTP)。
      # 容器内 443 仍启用 TLS；如需对外 HTTPS，追加 "8443:443" 并由前置反代终结域名流量。
      - "8888:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl/certs:ro
      - ./public:/usr/share/nginx/html:ro
      # 应用隐私/合规等独立 HTML，URL 前缀 /privacy
      - ./privacy:/usr/share/nginx/privacy:ro
