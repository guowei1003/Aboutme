services:
  c-mysql:
    image: mysql:8.0
    container_name: c-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:-aboutme}
      MYSQL_USER: ${DATABASE_USER:-aboutme}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-aboutme}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DATABASE_USER:-aboutme}", "-p${DATABASE_PASSWORD:-aboutme}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  daily-service:
    build:
      context: .
      dockerfile: services/daily_service/Dockerfile
    container_name: daily-service
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      c-mysql:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8001"

  biz-service:
    build:
      context: .
      dockerfile: services/biz_service/Dockerfile
    container_name: biz-service
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      c-mysql:
        condition: service_healthy
    expose:
      - "8002"

  profile-service:
    build:
      context: .
      dockerfile: services/profile_service/Dockerfile
    container_name: profile-service
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      c-mysql:
        condition: service_healthy
    expose:
      - "8003"

  scheduler-worker:
    build:
      context: .
      dockerfile: services/daily_service/Dockerfile
    container_name: scheduler-worker
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "-m", "service.worker"]
    depends_on:
      daily-service:
        condition: service_started
      redis:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: services/api_gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      daily-service:
        condition: service_started
      biz-service:
        condition: service_started
      profile-service:
        condition: service_started
    expose:
      - "8000"

  c-web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE: /api
    container_name: c-web
    restart: unless-stopped
    depends_on:
      - api-gateway
    ports:
      - "80:80"

volumes:
  mysql_data:
