services:
  web:
    # 构建交由 GitHub Actions 完成：CI 生成 public/ 并 rsync 到 /data/aboutme/public，
    # 容器只负责托管，直接挂载该目录，镜像不再包含站点内容。
    image: nginx:alpine
    container_name: kapibala-web
    restart: always
    ports:
      # 服务器 80 已被 collectcar-nginx 占用：HTTP 走 8888，HTTPS 走标准 443（空闲）。
      # 容器内 80/443 共用同一套站点配置（见 nginx.conf）。
      - "8888:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl/certs:ro
      - ./public:/usr/share/nginx/html:ro
      # 应用隐私/合规等独立 HTML，URL 前缀 /privacy
      - ./privacy:/usr/share/nginx/privacy:ro
