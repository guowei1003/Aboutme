name: Build and deploy static site

on:
  push:
    branches: [ "3.0.0", main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 锁文件已入库且全部指向 registry.npmjs.org，用 npm ci 保证可复现。
      # 主题已 fork 在 themes/fluid/ 并入库；Hexo 优先加载该目录，
      # 不要再 npm install hexo-theme-fluid，否则会引入版本不一致的原版主题。
      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify customized theme is checked out
        run: test -f themes/fluid/layout/index.ejs && test -f themes/fluid/layout/_partials/header/navigation.ejs

      - name: Generate Static Files
        run: npx hexo clean && npx hexo generate

      # 构建产物同步到服务器目录，由 docker-compose.yml bind mount 进 Nginx
      - name: Deploy site to /data/aboutme/public
        uses: easingthemes/ssh-deploy@v4
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: /data/aboutme/public
          SOURCE: "public/"
          ARGS: "-avz --delete"

      - name: Deploy privacy static pages
        uses: easingthemes/ssh-deploy@v4
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: /data/aboutme/privacy
          SOURCE: "privacy/"
          ARGS: "-avz"
