events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    server {
        listen 80;
        server_name kapibala.uno www.kapibala.uno;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name kapibala.uno www.kapibala.uno;

        ssl_certificate /etc/ssl/certs/kapibala.uno.pem;
        ssl_certificate_key /etc/ssl/certs/kapibala.uno.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        root /usr/share/nginx/html;
        index index.html;

        location = /privacy {
            return 301 /privacy/;
        }

        location ^~ /privacy/ {
            alias /usr/share/nginx/privacy/;
            index index.html;
        }

        # CI 发布后文件名不带内容哈希，长缓存/immutable 会让读者长期看到旧样式。
        # HTML 每次回源校验，静态资源最多陈旧 1 小时。
        location ~* \.html$ {
            add_header Cache-Control "no-cache, must-revalidate";
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            add_header Cache-Control "public, max-age=3600, must-revalidate";
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
