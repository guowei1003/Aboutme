# 站点信息
title: Kapibala
subtitle: AI 加持下的人类进化
description: 记录 AI 时代的人类进化历程
author: Kapibala
language: zh-CN
timezone: Asia/Shanghai

# 网址
url: https://kapibala.uno
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# 目录
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# 文章设置
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

# Markdown 设置
marked:
  prependRoot: true
  postAsset: true

# 主页设置
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# 分类和标签
default_category: uncategorized
category_map:
tag_map:

# 元数据元素
meta_generator: true

# 日期/时间格式
date_format: YYYY-MM-DD
time_format: HH:mm:ss
use_date_for_updated: false

# 分页
per_page: 10
pagination_dir: page

# 主题
theme: fluid

# 部署配置
deploy:
  type: ''

# 包含/排除文件
include:
exclude:
ignore:
